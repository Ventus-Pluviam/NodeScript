name: E2E（nightly / 手动）

# ── 为什么单独开一条 workflow（B1）─────────────────────────────────────────────
# ci.yml 里那条与 CI 逐字同源的 `./gradlew …` 恒带 `-PskipNpmE2E`：三个真 npm 路径
# （HostNodeNpmE2ETest 真装 lodash / NpmCacheSeedDeployerTest 仅凭种子 cache 离线 ci /
# P0LoopbackTest 桥→真 npm→树→点击全链路）在 PR 门里**永不执行** —— 它们恰好是
# 交付轨最危险的那段。这里跑的就是**同一条命令、只是不带那个 flag**。
#
# 与 ci.yml 分开而不是加个 job 的原因：nightly 会拉真 registry 网络装包（分钟级、
# 受上游可用性影响），不该把噪声和时长灌进每个 PR；而 PR 门要保持"分钟级、确定性"。
#
# 收口靠 .github/scripts/check-e2e-ran.sh：跑完**验尸**（XML 在不在、tests>0、skipped==0），
# 因为 `assumeTrue` 诚实跳过的契约在本机成立、在 CI 上会退化成一片绿的假通过。
on:
  schedule:
    # UTC 19:23 = 北京时间 03:23。刻意避开整点/半点：Actions 的调度在 :00 全球拥堵，
    # 实测能晚十几分钟才起（off-minute 是免费的稳定性）。
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-e2e:
    name: 真 npm 路径 E2E（不带 -PskipNpmE2E）
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 三个 E2E 有真网络装包；冷跑含 SDK + npm ci + 全量编译，留足余量
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件（platform-36 + build-tools）
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      # Node 24：既是 facade dist 的构建器（jvm-tests 同款），也是**被测的宿主**
      # —— HostNpm 从 `node -p process.execPath` 推 prefix 找 npm-cli.js，
      # setup-node 把 node 装进 /opt/hostedtoolcache/node/<ver>/x64/，旧写法
      # （写死 /usr/lib/node_modules/npm）在那里会静默跳过。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bridge/js/package-lock.json
      - name: 构建 facade dist（dist 已出库；bridgeDist 随包任务与 P0 回环要它）
        run: |
          npm --prefix bridge/js ci
          npm --prefix bridge/js run build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: 真 npm E2E（与 ci.yml 同一条命令，**不带** -PskipNpmE2E）
        run: |
          ./gradlew :domain:test :bridge:java:test :app-service:runtime:test :app-service:scheduler:test :app-service:script-repo:testDebugUnitTest :app-service:permission-center:test :app-service:packager:test :app-service:npm:test :platform:capabilities:testDebugUnitTest :platform:editor:testDebugUnitTest :platform:system:testDebugUnitTest :engine:node-process:testDebugUnitTest :ui:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      # 跑完验尸：Gradle 绿不代表真跑（assumeTrue 跳过也是绿）。`if: always()` 让它在
      # E2E 真红时也执行 —— 那时这步的 ✗ 行就是最短的病因说明。
      - name: 证明 E2E 真跑了（XML 在、tests>0、skipped==0）
        if: always()
        run: bash .github/scripts/check-e2e-ran.sh
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
