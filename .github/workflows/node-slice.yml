name: node-slice

# Node 24 垂直切片构建（docs §844 / §19 里程碑：最小 :node 进程 console.log 回传）
#
# 与 image-native.yml 的分工：那条跑 libopencv.so（20 分钟级、PR 门 paths 触发）；
# 本文件跑 fetch-and-build.sh → libnode.so + node（600MB 源码 + 半小时级）。
# 体量决定了它**不进 PR 默认门**：push paths 只在动了 Node 构建面时触发，
# 日常靠 workflow_dispatch 手动跑（版本升级回归时点一次）。
#
# 手法与 image-native 同源：runner 直跑脚本，不套 Docker —— runner 里再套
# docker build 要走嵌套虚拟化，慢且日志难读；Dockerfile 仍是发布封装，
# 调的是同一个脚本（见 Dockerfile 的 RUN 行）。
#
# 产物不随 APK 走：out/node 供 adb push 到设备做 §844 垂直切片验证；
# out/libnode.so.* 是 :bridge:native dlopen 的宿主引擎。artifact 给人下载核验。
# （例外：out/npm 是 vendored npm CLI 素材，它**确实要随 APK** —— 下载 artifact 后
# 解包到 node-runtime-build/out/npm/，assembleDebug 的 prepareNpmCliAssets 会取件。）
#
# 缓存两层（合并写法 actions/cache，命中即用、安全阀见各步骤注释）：
#   A. 下载层 `$WORK/dl`（NDK zip 722MB + Node tarball 30MB+，key 钉 VERSIONS.env
#      哈希 —— 版本一变即失效重下，不吃过期包）；
#   B. 编译层 ccache（V8 全量交叉编译是绝对大头：编译单元按预处理内容哈希，
#      脚本/打包步骤的改动不使它失效 —— "只改 §7 打包步骤"类重跑，解包+重链接即完）。
# Docker 发布轨不装 ccache → USE_CCACHE 开关恒假，无影响。
on:
  push:
    paths:
      - 'node-runtime-build/VERSIONS.env'
      - 'node-runtime-build/scripts/fetch-and-build.sh'
      - 'node-runtime-build/scripts/check-alignment.sh'
      - '.github/workflows/node-slice.yml'
  workflow_dispatch:

# 最小权限（2026-10-01 卫生补件）：本 workflow 只读仓库内容 —— 产物上传走 artifact 的
# 运行时令牌，缓存与 checkout 都不需要写权限。默认令牌权限过宽，这里显式收到只读。
permissions:
  contents: read

concurrency:
  # 同一分支重复触发时取消上一次（构建半小时级，串行等待没有信息量）。
  group: node-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-node:
    name: Node 24 → libnode.so + node（arm64-android26，16KB/平台/ABI 门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 180      # Node 全量交叉编译半小时级；CI 抢不到核时放宽
    env:
      # 全 job 共用一个 WORK_DIR：fetch-and-build.sh 按 $WORK/{dl,src,ndk,out}
      # 布局走，而"产物审计/上传"步骤也要读同一个 OUT —— 只在构建步骤里设 env 的话，
      # 后续步骤的 $WORK 是空的（会安静地 ls 到空路径然后失败在 artifact 上）。
      WORK_DIR: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装编译期依赖（build-essential + curl + unzip + xz + python3 + ccache）
        run: |
          # 不赌 runner 镜像预装：fetch-and-build 要 gcc/g++/ar（host toolset，
          # 见脚本 §4）、unzip（NDK 解包）、xz（tarball 解包）、python3（§3b/3c 补丁）。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl unzip xz-utils python3 ccache

      # A. 下载层缓存（NDK zip 722MB + Node tarball 30MB+）。
      # key 钉 VERSIONS.env 哈希：版本矩阵任一变更即换 key 重下，不吃过期包
      # （故意**不给** restore-keys：同名 zip 内容不同时旧包是毒药 —— 脚本 §1/§2 的
      # size/sha1 复验会 loud die，但干净重下比"复用+续传+再验"更省事；下载本就几分钟）。
      # 合并写法（actions/cache）：命中则用且构建后跳过存，未命中则构建后自动存 ——
      # 同 key 重复 save 会炸步骤，拆分写法的 restore+save 在这里是错的。
      - name: 缓存下载层（NDK zip + Node tarball）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/work/dl
          key: node-dl-${{ hashFiles('node-runtime-build/VERSIONS.env') }}

      # B. 编译层缓存（ccache dir，V8 全量交叉编译是绝对大头）。
      # 命中不看脚本字面 —— ccache 按预处理内容哈希：改脚本 §7 打包步骤
      # （cp/strip/门禁/基表，不碰任何 .cc/.h 预处理输入）时编译单元几乎全命中，
      # 只剩重链；改 §3b/3c 补丁（换 zlib.gyp/v8.gyp 源输入）时对应单元自然 miss 重编。
      # restore-keys 跨版本兜底是安全的（ccache 内容寻址，旧条目对新源码天然 miss，
      # 只占空间不毒构建）。编译器本体升级风险可忽略：交叉编译器来自 pin 死的 r28c
      # zip（不随 runner 镜像滚），host gcc 只编 mksnapshot 等小工具。
      - name: 缓存 ccache（V8 交叉编译单元）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: node-ccache-${{ hashFiles('node-runtime-build/VERSIONS.env') }}
          restore-keys: node-ccache-

      - name: 安装 NDK r28c（dl.google.com zip + size/sha1 校验，同脚本 §2）
        run: |
          # 不借 sdkmanager：fetch-and-build.sh 从 $WORK/ndk/android-ndk-$NDK_VERSION
          # 找 NDK（与 build-opencv.sh 同一布局），而 sdkmanager 装到
          # $ANDROID_SDK_ROOT/ndk/<VERSION_CODE>/，目录语义是"版本码"不是"版本名"，
          # 中间得再软链一层 —— image-native 这层漏过一次，死在工具链探测上。
          # 改走 zip：与脚本 §2 同源同校验（VERSIONS.env 的 NDK_ZIP_SIZE/NDK_SHA1），
          # 解包落点即脚本期望的路径。脚本 §2 还会再验一次（复验无害），§3 复用解包。
          V=node-runtime-build/VERSIONS.env
          NDK_VERSION="$(sed -n 's/^NDK_VERSION=//p' "$V")"
          NDK_ZIP_SIZE="$(sed -n 's/^NDK_ZIP_SIZE=//p' "$V")"
          NDK_SHA1="$(sed -n 's/^NDK_SHA1=//p' "$V")"
          API="$(sed -n 's/^ANDROID_API=//p' "$V")"
          [ -n "$NDK_VERSION" ] && [ -n "$NDK_ZIP_SIZE" ] && [ -n "$NDK_SHA1" ] \
            || { echo "VERSIONS.env 缺 NDK_VERSION/ZIP_SIZE/SHA1"; exit 1; }
          [ -n "$API" ] || { echo "VERSIONS.env 缺 ANDROID_API"; exit 1; }
          DL="$WORK_DIR/dl"
          mkdir -p "$DL" "$WORK_DIR/ndk"
          ZIP="$DL/android-ndk-${NDK_VERSION}-linux.zip"
          # 与 fetch-and-build.sh §2 同一 skip 判断（原抄漏了这层）：下载层缓存命中时
          # 文件已完整，无条件 `curl -C -` 会向 dl.google.com 发 Range 续传请求，
          # 该端点对续传在 HTTP/2 上断流（curl exit 92 PROTOCOL_ERROR）——缓存命中的
          # run 反而必红，重跑也红。命中即跳过，校验（下两行）照跑兜底。
          if [ -f "$ZIP" ]; then
            echo "[skip] NDK zip 已在（下载层缓存命中），跳过下载"
          else
            echo "下载 NDK $NDK_VERSION（约 $((NDK_ZIP_SIZE / 1024 / 1024))MB）…"
            curl -fsS -C - --retry 3 --retry-all-errors -o "$ZIP" \
              "https://dl.google.com/android/repository/$(basename "$ZIP")"
          fi
          echo "校验 size=$NDK_ZIP_SIZE sha1=${NDK_SHA1:0:16}…"
          actual_size=$(stat -c%s "$ZIP")
          [ "$actual_size" = "$NDK_ZIP_SIZE" ] || { echo "NDK zip 大小不符: $actual_size"; exit 1; }
          actual_sha1=$(sha1sum "$ZIP" | awk '{print $1}')
          [ "$actual_sha1" = "$NDK_SHA1" ] || { echo "NDK sha1 不符: $actual_sha1"; exit 1; }
          unzip -q "$ZIP" -d "$WORK_DIR/ndk"
          TOOLCHAIN="$WORK_DIR/ndk/android-ndk-$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          # 与 fetch-and-build.sh §4 同一探针（aarch64-linux-android$API-clang）
          [ -x "$TOOLCHAIN/bin/aarch64-linux-android${API}-clang" ] \
            || { echo "解包后无 aarch64-linux-android${API}-clang: $TOOLCHAIN"; exit 1; }
          echo "[OK] NDK 就位: $TOOLCHAIN"

      - name: 构建 libnode + node（fetch-and-build.sh 全链，ccache 开）
        env:
          USE_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # Node tarball（30MB+）由脚本 §1 自行下载，官方 sha256 由 VERSIONS.env 的
          # NODE_SHA256 钉死校验（2026-09-29 起唯一来源）；16KB/平台/ABI 门禁在脚本
          # §7（含 libc++_shared 同门禁），已是 fatal，无需重复断言。
          # USE_CCACHE=1 让脚本 §4 经 ccache 包 CC/CXX（ccache 不在则 WARN 走旧路，
          # 不炸构建）。CCACHE_DIR 落在 workspace 内（runner 家目录不持久，只有
          # workspace 相对路径能被 actions/cache 存走）。ccache 零统计开局即 -z
          # 清零，下方审计步骤读 -s 即"本轮真实命中率"（不清零会把 restore 进来的
          # 旧计数混进来，分不清本轮有没有命中）。
          ccache -z || true
          bash node-runtime-build/scripts/fetch-and-build.sh 2>&1 | tee /tmp/node-slice.log
          grep -q '完成。产物' /tmp/node-slice.log || { echo "构建日志无完成行"; exit 1; }
          ccache -s || true

      - name: 产物审计（基表 + 文件清单）
        run: |
          cat "$WORK_DIR/out/SHASUMS256"
          ls -l "$WORK_DIR/out/node" "$WORK_DIR"/out/libnode.so*
          # npm 素材基表逐文件 ~1.5k 行：只报行数与体量，全文在 artifact 里
          echo "--- npm 素材 ---"
          du -sh "$WORK_DIR/out/npm"
          wc -l "$WORK_DIR/out/npm-manifest.sha256"
          head -3 "$WORK_DIR/out/npm-manifest.sha256"

      - name: 上传 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-slice
          path: |
            work/out/node
            work/out/libnode.so*
            work/out/libc++_shared.so
            work/out/SHASUMS256
            work/out/config.gypi
            work/out/config.mk
            # vendored npm CLI 素材（§10.2）：:app 随包任务取件用（解包后落
            # node-runtime-build/out/npm/，prepareNpmCliAssets 的候选位），逐文件基表同行出库。
            work/out/npm
            work/out/npm-manifest.sha256
          if-no-files-found: error

