name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限（2026-10-01 卫生补件）：本 workflow 只**读**仓库内容 —— 上传测试报告走 artifact
# 的运行时令牌，不需要 contents: write。默认令牌权限过宽，这里显式收到只读。
permissions:
  contents: read

concurrency:
  # 同一分支重复触发时取消上一次（与 node-slice / image-native 同款纪律：串行等待没有信息量）。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM 单测（domain / bridge:java / runtime / scheduler / script-repo / permission-center / packager / npm / capabilities / platform:system / engine:node-process / ui / app）
    runs-on: ubuntu-latest
    timeout-minutes: 45       # 冷跑含 SDK 组件安装 + npm ci + 全量编译，实测 20 分钟级；留一倍余量
    steps:
      # actions 一律钉 commit SHA（2026-10-01 卫生补件）：tag 是可移动的，被改指即等于
      # 在 CI 里跑了别人的代码。注释里的 vX 是对应的跟踪线，由 .github/dependabot.yml 定期提 PR。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # Android SDK：runner 自带 cmdline-tools（不用 android-actions/setup-android：
      # 该 action 在 Google 新增 license 时卡交互确认挂掉，jumpy-porcupine 的 PR CI 已实测红在这步）。
      # 直调 sdkmanager 非交互装 AGP 所需组件（compileSdk/targetSdk 35 系，见 gradle/libs.versions.toml）。
      - name: 安装 Android SDK 组件（platform-35 + build-tools）
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bridge/js/package-lock.json
      - name: 构建 facade dist（dist 已出库 = 构建产物；bridgeDist 随包任务与 e2e 测试要它）
        run: |
          npm --prefix bridge/js ci
          npm --prefix bridge/js run build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # 不写 gradle-version：版本的事实来源是仓库里的 gradlew wrapper（gradle-wrapper.properties
        # 的 8.9，与 AGP 8.5.2 匹配）。写死在这里会变成第二个事实来源，迟早与 wrapper 漂移。
      - name: JVM 单元测试
        run: |
          ./gradlew :domain:test :bridge:java:test :app-service:runtime:test :app-service:scheduler:test :app-service:script-repo:testDebugUnitTest :app-service:permission-center:test :app-service:packager:test :app-service:npm:test :platform:capabilities:testDebugUnitTest :platform:system:testDebugUnitTest :engine:node-process:testDebugUnitTest :ui:testDebugUnitTest :app:testDebugUnitTest --stacktrace -PskipNpmE2E
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
  js-tests:
    name: bridge/js facade 单测（tsc + node --test）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"   # 对齐 node-runtime-build/VERSIONS.env 的 Node 24 口径（审查步骤 7：22→24）
          cache: npm
          cache-dependency-path: bridge/js/package-lock.json
      - name: wire 生成物同步门（schema → wire-types.ts / WireMethods.kt，漂移即红）
        # 生成器零依赖，不需要 npm ci；git diff 必须在仓库根跑（两份生成物跨模块）。
        run: |
          npm --prefix bridge/js run gen:wire
          git diff --exit-code
      - name: 第三方许可声明同步门（VERSIONS.env → THIRD_PARTY_NOTICES.md，漂移即红）
        # 生成器零依赖、不需要 npm ci，与上面 wire 门同一手法。放本 job 是因为这里已
        # setup-node 24（生成器要 node ≥18 的 ESM），别处再开一个 job 只为跑一个
        # 几百行的生成器不划算。版本事实来源是 node-runtime-build/VERSIONS.env ——
        # 改版本没跑生成器 = 这里的 git diff 红（漏改的许可声明在分发时是法律问题）。
        run: |
          node node-runtime-build/licenses/gen-notices.mjs
          git diff --exit-code
      - name: 安装 facade 依赖（npm ci，供单测与 typedoc 用）
        working-directory: bridge/js
        run: npm ci
      - name: 用户向 API 参考同步门（typedoc → docs/api/，漂移即红）
        # 与上面两条生成物门同一条纪律：`docs/api/**` 是 **typedoc 生成物**，
        # 手改它没意义（下次生成即被覆盖），改了 facade 注释不重跑生成器 = 这里红。
        # 放本 job 的理由同 gen-notices：这里已有 node 24 + npm ci 过的 node_modules
        # （typedoc 是 devDependency，装了就位）。生成器版本钉在 package-lock 里，
        # 输出因此可复现；--emit none 之外不必再设，漂移由 git diff 判。
        working-directory: bridge/js
        run: |
          npm run docs:api
          git -C ../.. diff --exit-code
      - name: facade 单元测试
        working-directory: bridge/js
        run: npm test

  dependency-review:
    name: 依赖审查（新增依赖的漏洞 / 许可证）
    # 只在 PR 上跑：本 action 判的是「这个 PR 相对 base 改了什么依赖」，
    # 没有 base 就无从判（push 事件上它只能靠显式 base-ref/head-ref，那等于自己
    # 维护一套"上一次是什么"的状态）。仓里的公开依赖面 = bridge/js（npm）+ 
    # gradle/libs.versions.toml（GitHub 依赖图能识别的生态）；两者都只在这一个 job 看。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 公开 action 也钉 commit SHA（与全仓纪律一致）；tag v5.0.0。
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # 与 §11.2 T1–T3 的供应链口径一致：**任何已知漏洞都挡**（默认是 high 才挡）。
          # 依赖面很小（facade 的 devDependencies + Gradle 的构建期依赖），挡得住才有意义。
          fail-on-severity: low
          # 许可证面：本仓随 APK 分发第三方二进制，许可合规是硬约束（见 THIRD_PARTY_NOTICES.md
          # 与 D8）—— 依赖引入 copyleft 会在分发时变成法律问题，所以开许可证检查。
          license-check: true
          # 但**不**在这里设 allow-licenses 白名单：白名单要覆盖 npm + Maven 两个生态的
          # 全部许可证标识（含 SPDX 表达式），列不全就会把合法的 MIT/Apache 也挡下来。
          # 先让检查跑起来把现状摸清（首次跑的结果进流水），要收紧再单独一批加白名单。

  docs-check:
    name: 文档链接门（*.md 的相对链接必须存在）
    runs-on: ubuntu-latest
    timeout-minutes: 5        # 纯文件存在性检查，秒级
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 检查文档相对链接（脚本自带规则说明；本机同一条命令可跑）
        run: bash .github/scripts/check-doc-links.sh
  # ── Android 构建与全模块 Lint（B1）─────────────────────────────────────────
  # 2026-10-01 之前 APK 构建与 lint **不在任何 workflow 里**（旧注见 docs/backlog.md B1）。
  # assembleDebug 与 lintDebug 合一个 job：两者共用同一套冷启动开销（SDK 组件 + npm ci +
  # Gradle 缓存），拆两个 job 等于把这份开销付两遍；步骤名分开红，信号不混。
  # 引擎三件 / libopencv / npm 素材都不在 git：装配期按「缺位只 warn」放行（`autoscript.
  # engine-natives`），所以 CI 出的是**无引擎二进制**的 APK —— 这是如实交付，不是漏项：
  # 真机红测走 node-slice artifact（见 docs/backlog.md B1 后续）。
  android-build:
    name: Android 构建与 Lint（assembleDebug + 全模块 lintDebug）
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 冷跑含 SDK 组件安装 + npm ci + 全量 Kotlin 编译；实测分钟级，留足
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件（platform-35 + build-tools）
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bridge/js/package-lock.json
      # dist 是构建产物（不在 git），而 `prepareBridgeDistAssets` 缺件**直接红**（空 dist
      # = 没跑过 npm build），所以这一步是 assemble/lint 的前置，不是可选优化。
      - name: 构建 facade dist（随包资产 prepareBridgeDistAssets 的输入）
        run: |
          npm --prefix bridge/js ci
          npm --prefix bridge/js run build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # 先 lint 后 assemble：lint 快（全模块增量实测 3~6s）且抓的是会**静默**错的那类
      # （NewApi 调了高版本 API、NotificationPermission 没声明权限就发通知）——早失败早看见。
      # 不加模块前缀（`./gradlew lintDebug`）= 跑**所有**带 lint 的模块：`:app` 一个模块的
      # 报告看不见库模块的 NewApi（`checkDependencies` 缺省 false），而线上崩的恰恰是库模块里
      # 那几处 —— 首次全量跑就抓出 13 处真错（`Stream#toList` API34、`getMainExecutor` API28…），
      # 全是 minSdk 26 设备上的 NoSuchMethodError 级问题。
      - name: Android Lint（全模块；NewApi / NotificationPermission 默认即 error）
        run: ./gradlew lintDebug --stacktrace
      - name: 构建 Debug APK（§19 交付轨）
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: 上传 APK 与 Lint 报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
