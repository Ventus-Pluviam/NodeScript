name: image-native

# libopencv.so 构建（docs §9.2 / §16）
#
# 与 ci.yml 的分工：本文件**只**跑 OpenCV 静态链接 + 我们的桥面 C++ → 单个
# libopencv.so（arm64-android26），跑 node-runtime-build/scripts/build-opencv.sh
# —— 同一脚本也由 node-runtime-build/Dockerfile 的 OpenCV 轨调用，两处同源同门禁。
# Node 24 那条轨（fetch-and-build.sh → libnode.so）**不经本文件**：体量差一个量级
# （600MB 源码 + 半小时以上），放进 PR 门会让每次改动都等一轮；libnode 的构建门
# 由 .github/workflows/node-slice.yml 承担（动了 Node 构建面才跑 + workflow_dispatch，
# runner 直跑同一脚本；Dockerfile 只是发布封装，见 ci.yml 末注）。
#
# 两个 job 的分工：host-image-semantics 先跑（判读对，快），build-opencv 后跑
# （aarch64 出得了、过 16KB/NEEDED 门禁，慢）。判读先红就不用等构建那一轮。
#
# 产物不随 APK 走：装配侧 app/build.gradle.kts 的 prepareEngineNativeLibs 候选位
# 含 node-runtime-build/out-opencv/libopencv.so，本 workflow 的 artifact 是给
# 人下载核验的（16KB 对齐 + NEEDED 白名单在脚本尾部已断言）。
#
# 缓存三处（合并写法 actions/cache —— 与 node-slice.yml 同纪律）：
#   host job：`~/.ccache` 挂 host gcc/g++ 的 ccache（OpenCV host 静态库 5–10 分钟档）；
#   device job：`work/dl`（NDK zip，与 Node 轨同 key 结构、前缀不同防撞）与
#   `.ccache`（device 侧 OpenCV 交叉编译 + 桥面两文件的 ccache，脚本 §3/§5 经
#   USE_CCACHE 接管）。key 钉 VERSIONS.env 哈希（device 侧编译单元内容寻址，跨版本
#   restore-keys 只占空间不毒构建；dl 层不给 restore-keys，旧包是毒药干净重下）。
# 触发面（2026-09-25 修过一次"推了分支却没跑"）：
# 初版写成 `push: branches:[main]` + `pull_request: paths:`，而 image-native 这类
# 长生命周期分支既不在 main、又还没有 PR → **一步都不跑**（gh token 无该私仓权限，
# 开不了 PR 也就触发不了）。故 push 与 PR **都不限分支**，靠 paths 过滤把构建
# 限定在"真的动了图像构建面"的提交上 —— 路径过滤才是轻量的来源，不是分支白名单。
on:
  push:
    paths:
      - 'node-runtime-build/VERSIONS.env'
      - 'node-runtime-build/scripts/build-opencv.sh'
      - 'node-runtime-build/scripts/check-opencv-alignment.sh'
      - 'bridge/image/**'
      - '.github/workflows/image-native.yml'
  pull_request:
    paths:
      - 'node-runtime-build/VERSIONS.env'
      - 'node-runtime-build/scripts/build-opencv.sh'
      - 'node-runtime-build/scripts/check-opencv-alignment.sh'
      - 'bridge/image/**'
      - '.github/workflows/image-native.yml'
  workflow_dispatch:

# 最小权限（2026-10-01 卫生补件）：本 workflow 只读仓库内容 —— 产物上传走 artifact 的
# 运行时令牌，缓存与 checkout 都不需要写权限。默认令牌权限过宽，这里显式收到只读。
permissions:
  contents: read

concurrency:
  # 同一分支重复触发时取消上一次（构建 20 分钟级，串行等待没有信息量）。
  group: image-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 宿主机语义门禁（docs §9.2）：把计算核三 TU（imgnative{,_match,_feature}.cpp）直链进 x86_64 静态 OpenCV 跑像素断言。
  # 与 build-opencv 的关系不是替代而是分工 —— NDK 那侧证明 aarch64 编得出、过 16KB/NEEDED
  # 门禁，本 job 证明**判读对**（通道序/ROI 偏移/扫过 vs 扫过 0 像素译反了照样出结论，
  # 上一处就是这么漏的：三门全绿之际 findColor 的 alpha 从未参与判定）。放在前面：
  # 它比 OpenCV 全量 configure 快一个量级，判读先红就不用等二十分钟构建。
  host-image-semantics:
    name: 图像计算核宿主机语义门禁（x86_64 直链 OpenCV 4.14.0 同 commit）
    runs-on: ubuntu-latest
    timeout-minutes: 30        # OpenCV host configure+build 实测 5–10 分钟
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装编译期依赖（cmake + ninja + g++ + git + ccache）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git ccache

      # host OpenCV 静态库 5–10 分钟档：g++ 经 ccache 包调用，BUILD_DIR 复用即命中。
      # run-host-tests.sh 的 BUILD 必填（$OCV_HOST_BUILD，审查步骤 1 起无缺省）——
      # 这里显式指进 workspace 才能被 actions/cache 存走；commit 对表由脚本内 pin 源 verdict。
      - name: 缓存 host ccache（x86_64 OpenCV 静态库）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache-host
          key: ocv-host-ccache-${{ hashFiles('node-runtime-build/VERSIONS.env') }}
          restore-keys: ocv-host-ccache-

      - name: 拉取 OpenCV @ VERSIONS.env 的 commit pin
        run: |
          # filter=blob:none + --no-checkout：与 build-opencv.sh 同一手法（省流量，
          # 又能让 run-host-tests.sh 的 commit 对表有 .git 可查）。不拉 tag/tarball ——
          # tarball 无从校验 HEAD，对表只能 WARN 跳过，"同 commit"就退化成口号。
          V=node-runtime-build/VERSIONS.env
          OPENCV_COMMIT="$(sed -n 's/^OPENCV_COMMIT=//p' "$V")"
          OPENCV_VERSION="$(sed -n 's/^OPENCV_VERSION=//p' "$V")"
          [ -n "$OPENCV_COMMIT" ] || { echo "VERSIONS.env 缺 OPENCV_COMMIT"; exit 1; }
          echo "clone opencv @ $OPENCV_VERSION ($OPENCV_COMMIT)"
          git clone --filter=blob:none --no-checkout https://github.com/opencv/opencv.git /tmp/ocvpin
          git -C /tmp/ocvpin -c advice.detachedHead=false checkout "$OPENCV_COMMIT"

      - name: 跑宿主机语义门禁（编译 + 断言，ccache 开）
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-host
          CCACHE_MAXSIZE: 2G
          OCV_HOST_BUILD: ${{ github.workspace }}/ocvhostbuild
          CC: ccache gcc
          CXX: ccache g++
        run: |
          ccache -z || true
          bash bridge/image/test/cpp/run-host-tests.sh /tmp/ocvpin
          ccache -s || true

  build-opencv:
    name: OpenCV 4.14.0 → libopencv.so（arm64-android26，kleidicv 审计）
    runs-on: ubuntu-latest
    timeout-minutes: 90        # OpenCV 全量 configure+编译实测 15–30 分钟；CI 抢不到核时放宽
    env:
      # 全 job 共用一个 WORK_DIR：build-opencv.sh 按 $WORK/{src,ndk,out-opencv,build-opencv}
      # 布局走，而"产物审计"步骤也要读同一个 OUT —— 只在构建步骤里设 env 的话，
      # 后续步骤的 $WORK 是空的（审计步骤会安静地 ls 到空路径然后失败在 artifact 上）。
      WORK_DIR: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装编译期依赖（cmake + ninja + unzip + git + python3 + ccache）
        run: |
          # unzip 是 NDK 解包要用的：放在 NDK 步骤**之前**，不赌 runner 镜像预装
          # （赌输了要等 700MB 下载完才在 unzip 上炸，白等一次）。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build unzip git python3 ccache

      - name: 缓存下载层（NDK zip，与 Node 轨同文件、前缀不同防撞）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/work/dl
          key: ocv-dl-${{ hashFiles('node-runtime-build/VERSIONS.env') }}

      - name: 缓存 ccache（device OpenCV 交叉编译 + 桥面编链）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ocv-ccache-${{ hashFiles('node-runtime-build/VERSIONS.env') }}
          restore-keys: ocv-ccache-

      - name: 安装 NDK r28c（dl.google.com zip + size/sha1 校验，同 Node 管线）
        run: |
          # 不借 sdkmanager：build-opencv.sh 从 $WORK/ndk/android-ndk-$NDK_VERSION
          # 找 NDK（fetch-and-build.sh 的同一布局），而 sdkmanager 装到
          # $ANDROID_SDK_ROOT/ndk/<VERSION_CODE>/，目录语义是"版本码"不是"版本名"，
          # 中间得再软链一层 —— 2026-09-24 实测就是这层漏了，构建死在工具链探测上
          # （[FATAL] NDK clang 缺失: .../work/ndk/android-ndk-r28c/toolchains/…）。
          # 改走 zip：与 Node 管线同源同校验（VERSIONS.env 的 NDK_ZIP_SIZE/NDK_SHA1），
          # 解包落点即脚本期望的路径，不依赖 runner 预装 SDK 的位置。
          V=node-runtime-build/VERSIONS.env
          NDK_VERSION="$(sed -n 's/^NDK_VERSION=//p' "$V")"
          NDK_ZIP_SIZE="$(sed -n 's/^NDK_ZIP_SIZE=//p' "$V")"
          NDK_SHA1="$(sed -n 's/^NDK_SHA1=//p' "$V")"
          API="$(sed -n 's/^ANDROID_API=//p' "$V")"
          [ -n "$NDK_VERSION" ] && [ -n "$NDK_ZIP_SIZE" ] && [ -n "$NDK_SHA1" ] \
            || { echo "VERSIONS.env 缺 NDK_VERSION/ZIP_SIZE/SHA1"; exit 1; }
          [ -n "$API" ] || { echo "VERSIONS.env 缺 ANDROID_API"; exit 1; }
          DL="$WORK_DIR/dl"
          mkdir -p "$DL" "$WORK_DIR/ndk"
          ZIP="$DL/android-ndk-${NDK_VERSION}-linux.zip"
          # 与 node-slice 同一 skip 判断（下载层缓存命中即跳过，校验照跑）：
          # 缺这层时命中缓存也白下 688MB。
          if [ -f "$ZIP" ]; then
            echo "[skip] NDK zip 已在（下载层缓存命中），跳过下载"
          else
            echo "下载 NDK $NDK_VERSION（约 $((NDK_ZIP_SIZE / 1024 / 1024))MB）…"
            curl -fsS --retry 3 --retry-all-errors -o "$ZIP" \
              "https://dl.google.com/android/repository/$(basename "$ZIP")"
          fi
          echo "校验 size=$NDK_ZIP_SIZE sha1=${NDK_SHA1:0:16}…"
          actual_size=$(stat -c%s "$ZIP")
          [ "$actual_size" = "$NDK_ZIP_SIZE" ] || { echo "NDK zip 大小不符: $actual_size"; exit 1; }
          actual_sha1=$(sha1sum "$ZIP" | awk '{print $1}')
          [ "$actual_sha1" = "$NDK_SHA1" ] || { echo "NDK sha1 不符: $actual_sha1"; exit 1; }
          unzip -q "$ZIP" -d "$WORK_DIR/ndk"
          TOOLCHAIN="$WORK_DIR/ndk/android-ndk-$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          # 与 build-opencv.sh:51 同一探针（aarch64-linux-android$API-clang）
          [ -x "$TOOLCHAIN/bin/aarch64-linux-android${API}-clang" ] \
            || { echo "解包后无 aarch64-linux-android${API}-clang: $TOOLCHAIN"; exit 1; }
          echo "[OK] NDK 就位: $TOOLCHAIN"

      - name: 编译 libopencv.so（ccache 开）
        env:
          USE_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # kleidicv 走 gitlab.arm.com 的 release 包：从下方日志的 `kleidicv 状态:`
          # 一行读 ON/OFF（判据是 configure 摘要的 Custom HAL，见脚本 3b 段；软降级不
          # fatal，结论也写进 SHASUMS256 审计行）。上面 tee 那份 log 也是 grep 的源。
          # USE_CCACHE=1 让脚本 §3（cmake launcher）与 §5（桥面编链）经 ccache；
          # ccache 不在则 WARN 走旧路。ccache -z/-s 同 node-slice 的本轮命中率口径。
          ccache -z || true
          bash node-runtime-build/scripts/build-opencv.sh 2>&1 | tee /tmp/build-opencv.log
          grep -q '完成。产物' /tmp/build-opencv.log || { echo "构建日志无完成行"; exit 1; }
          grep 'kleidicv 状态:' /tmp/build-opencv.log
          ccache -s || true

      - name: 产物审计（16KB LOAD + NEEDED 白名单 + 审计行）
        run: |
          cat "$WORK_DIR/out-opencv/SHASUMS256"
          ls -l "$WORK_DIR/out-opencv/libopencv.so"

      - name: 上传 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libopencv
          path: |
            work/out-opencv/libopencv.so
            work/out-opencv/SHASUMS256
          if-no-files-found: error
