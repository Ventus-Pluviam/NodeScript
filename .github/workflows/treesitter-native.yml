name: tree-sitter native build

on:
  push:
    branches: [main]
    paths:
      - 'bridge/treesitter/**'
      - '.github/workflows/treesitter-native.yml'
      - 'node-runtime-build/VERSIONS.env'
  pull_request:
    paths:
      - 'bridge/treesitter/**'
      - '.github/workflows/treesitter-native.yml'
      - 'node-runtime-build/VERSIONS.env'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install NDK r28c
        run: |
          # 不使用 android-actions/setup-android：v3 会额外请求已从 Google 仓库移除的
          # `tools` 包，导致 2026-10-06 的构建在 NDK 安装前失败。
          # 版本号**从 VERSIONS.env 现读**，不在这里写第二份：曾经手抄的
          # `ndk;28.0.12674087` 与 build-treesitter.sh 的 source.properties 校验对不上，
          # 门禁在 NDK 版本漂移上红过一轮（目录语义是版本码，故取 NDK_VERSION_CODE）。
          V=node-runtime-build/VERSIONS.env
          NDK_CODE="$(sed -n 's/^NDK_VERSION_CODE=//p' "$V")"
          [ -n "$NDK_CODE" ] || { echo "$V 缺 NDK_VERSION_CODE"; exit 1; }
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_CODE"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_CODE" >> "$GITHUB_ENV"
      
      - name: Build tree-sitter natives
        run: bash bridge/treesitter/scripts/build-treesitter.sh
        env:
          WORK_DIR: ${{ github.workspace }}/work
      
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: treesitter-natives-arm64-v8a
          path: work/out-treesitter/arm64-v8a/*.so
          retention-days: 7
      
      - name: Show build output
        run: |
          ls -lh work/out-treesitter/arm64-v8a/ || { echo "构建产物目录不存在"; exit 1; }
